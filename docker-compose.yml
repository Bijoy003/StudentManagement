services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: student_management-app:latest
    container_name: studentmanagement-web
    user: root
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__DatabaseConnection: "Server=db;Database=StudentManagement;User Id=sa;Password=YourStrong@Password1;TrustServerCertificate=True"
    volumes:
      - dp_keys:/home/app/.aspnet/DataProtection-Keys

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: studentmanagement-db
    environment:
      SA_PASSWORD: "YourStrong@Password1"
      ACCEPT_EULA: "Y"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong@Password1' -Q 'SELECT 1' -b"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    volumes:
      - sql_data:/var/opt/mssql

# --- THIS SECTION IS REQUIRED ---
volumes:
  sql_data:
  dp_keys: